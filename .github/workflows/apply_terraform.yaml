name: terraform apply
on:
  workflow_call:
    inputs:
      update-discord-bot:
        type: boolean
        default: true
        description: "Whether to update discord bot's image or not"
      update-deletion-detector:
        type: boolean
        default: true
        description: "Whether to update deletion detector's image or not"
  workflow_dispatch:
    inputs:
      update-discord-bot:
        type: boolean
        default: true
        description: "Whether to update discord bot's image or not"
      update-deletion-detector:
        type: boolean
        default: true
        description: "Whether to update deletion detector's image or not"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/main/
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba
      # azure/login's latest commit on master doesn't include lib/main/index.js
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Init terraform
        run: terraform init
      - name: Get Discord Bot's tag
        id: discord-bot-tag
        run: |
          if [ "${{inputs.update-discord-bot}}" = "true" ]; then
            echo "tag=${{github.sha}}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(terraform output discord_bot_latest_image_tag)" >> "$GITHUB_OUTPUT"
          fi
      - name: Get Deletion Detector's tag
        id: deletion-detector-tag
        run: |
          if [ "${{inputs.update-deletion-detector}}" = "true" ]; then
            echo "tag=${{github.sha}}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(terraform output deletion_detector_latest_image_tag)" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply terraform
        run: |
          terraform apply -auto-approve -input=false -var="discord_bot_commit_hash=${{steps.discord-bot-tag.outputs.tag}}"\
            -var="deletion_detector_commit_hash=${{steps.deletion-detector-tag.outputs.tag}}"\
            -var="github-app-id=${{vars.GH_APP_ID}}"\
            -var="github-installation-id=${{vars.GH_INSTALLATION_ID}}"\
            -var="discord-app-id=${{vars.DISCORD_APP_ID}}"\
            -var="discord-public-key=${{vars.DISCORD_PUBLIC_KEY}}"
        env:
          ARM_USE_OIDC: true
