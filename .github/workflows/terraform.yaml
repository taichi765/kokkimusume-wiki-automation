name: terraform apply
on:
  push:
    branches: master

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_APPLY_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_APPLY_SUBSCRIPTION_ID }}
      - name: Apply terraform
        run: terraform apply -var="commit_sha256=${{github.sha}}"
        