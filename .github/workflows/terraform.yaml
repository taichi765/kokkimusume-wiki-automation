name: terraform apply
on:
  push:
    branches: master

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve -var="commit_sha256=${{github.sha}}"\
            -var="github-app-id=${{vars.GH_APP_ID}}"\
            -var="github-installation-id=${{vars.GH_INSTALLATION_ID}}"\
            -var="discord-app-id=${{vars.DISCORD_APP_ID}}"
            -var="discord-public-key=${{vars.DISCORD_PUBLIC_KEY}}"
