name: Deploy bot
on:
  push:
    branches: master
    paths:
      - main.tf
      - .terraform.lock.hcl
      - go.work*
      - discord-bot/**
      - common/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yaml
  deploy:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        run: az acr login --name kokkimusumeDiscordbotRegistry
      - name: Build and push
        run: |
          TAG=kokkimusumediscordbotregistry.azurecr.io/discordbot:${{github.sha}}
          docker build -t $TAG
          docker push $TAG
          
  
