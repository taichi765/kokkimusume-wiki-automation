name: CD
on:
  push:
    branches: master

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  deploy_image:
    needs: ci
    if: ${{ needs.ci.outputs.discord_bot_success }}
    uses: ./.github/workflows/deploy_image.yaml
    with:
      version: v0.0.0 #TODO: dummy

  apply_terraform:
    needs: ci
    if: ${{ needs.ci.outputs.terraform_success }}
    uses: ./.github/workflows/apply_terraform.yaml
    with:
      update_image: ${{ needs.ci.outputs.update_image }}
  
  update_page:
    needs: ci
    if: ${{ needs.ci.outputs.page_updater_success }}
    uses: ./.github/workflows/update_page.yaml
