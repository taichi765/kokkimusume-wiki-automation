name: CD
on:
  push:
    branches: master

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout:
      - name: Get version
        id: get-version
        run: |
          TAG=$(git describe --tags --abbrev=0 --match "discord-bot/**")
          echo "version=${TAG#discord-bot/}" >> "$GITHUB_OUTPUT"

  deploy-image:
    needs: [ci,get-version]
    if: ${{ needs.ci.outputs.discord-bot-success == 'true' }}
    uses: ./.github/workflows/deploy_image.yaml
    with:
      version: ${{ needs.get-version.outputs.version }} #TODO: dummy

  apply-terraform:
    needs: ci
    if: ${{ needs.ci.outputs.terraform-success == 'true' }}
    uses: ./.github/workflows/apply_terraform.yaml
    with:
      update-image: ${{ needs.ci.outputs.update-image == 'true' }}
  
  update-page:
    needs: ci
    if: ${{ needs.ci.outputs.page-updater-success == 'true' }}
    uses: ./.github/workflows/update_page.yaml
    secrets:
      WIKIWIKI_PASSWORD: ${{ secrets.WIKIWIKI_PASSWORD }}
