name: Update Pages
on:
  push:
    branches: master
    paths:
      - 'data/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      WIKIWIKI_PASSWORD:
        required: true

jobs:
  update-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page-updater/
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          sparse-checkout: |
            wikiwiki/
            types/
            page-updater/
            data/
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version-file: 'page-updater/go.mod'
          cache-dependency-path: 'page-updater/go.sum'
      - run: go run .
        env:
          WIKIWIKI_PASSWORD: ${{ secrets.WIKIWIKI_PASSWORD }}
