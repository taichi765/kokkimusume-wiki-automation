name: Update Pages
on:
  push:
    branches: master
    paths:
      - ./data/**
  workflow_dispatch:
  workflow_call:

jobs:
  generate_page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            common/**
            page-updater/**
            data/**
            go.work
            go.sum
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.work
      - run: cd ./page-updater/&&go run .
        env:
          WIKIWIKI_PASSWORD: ${{ secrets.WIKIWIKI_PASSWORD }}
    
