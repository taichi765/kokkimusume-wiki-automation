name: CI
on:
  pull_request:
    branches: master
  workflow_call:
    outputs:
      page-updater-success:
        value: ${{ jobs.page-updater-check.result == 'success' }}
      discord-bot-success:
        value: ${{ jobs.discord-bot-check.result == 'success' }}
      deletion-detector-success:
        value: ${{ jobs.deletion-detector-check.result == 'success' }}
      terraform-success:
        value: ${{ jobs.terraform-check.result == 'success' }}
      terraform-non-failure:
        value: ${{ jobs.terraform-check.result == 'success' || jobs.terraform-check.result == 'skipped' }}

jobs:
  paths-filter:
    uses: ./.github/workflows/paths_filter.yaml

  page-updater-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.page-updater == 'true' }}
    defaults:
      run:
        working-directory: page-updater/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            types/
            wikiwiki/
            page-updater/
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./page-updater/go.mod
          cache-dependency-path: ./page-updater/go.sum
      - name: Run tests
        run: go test
  
  discord-bot-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.discord-bot == 'true' }}
    defaults:
      run:
        working-directory: discord-bot/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            discord-bot/
            types/
      - uses: actions/setup-go@v7
        with:
            go-version-file: ./discord-bot/go.mod
            cache-dependency-path: ./discord-bot/go.sum
      - name: Run tests
        run: go test

  deletion-detector-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.deletion-detector == 'true' }}
    defaults:
      run:
        working-directory: deletion-detector/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deletion-detector/
            wikiwiki/
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./deletion-detector/go.mod
          cache-dependency-path: ./deletion-detector/go.sum
      - name: Run tests
        run: go test
  
  terraform-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.terraform == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            terraform/
      - uses: hashicorp/setup-terraform@v4
      - name: Init and validate .tf files for bootstrap
        run: |
          cd terraform/bootstrap/
          terraform init -backend=false
          terraform validate
      - name: Init and validate .tf files for main
        run: |
          cd terraform/main/
          terraform init -backend=false
          terraform validate
  