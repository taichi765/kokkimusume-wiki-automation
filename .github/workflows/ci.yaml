name: CI
on:
  pull_request:
    branches: master
  workflow_call:
    outputs:
      page-updater-success:
        value: ${{ jobs.page-updater-check.result == 'success' }}
      discord-bot-success:
        value: ${{ jobs.discord-bot-check.result == 'success' }}
      terraform-success:
        value: ${{ jobs.terraform-check.result == 'success' }}
      update-image:
        description: "whether container image should be updated or not"
        value: ${{ jobs.paths-filter.outputs.terraform-image-only || jobs.paths-filter.outputs.terraform-both }}

jobs:
  paths-filter:
    uses: ./.github/workflows/paths_filter.yaml

  page-updater-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.page-updater }}
    defaults:
      run:
        working-directory: page-updater/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            common/
            page-updater/
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./page-updater/go.mod
      - name: Run tests
        run: go test
  
  discord-bot-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.discord-bot }}
    defaults:
      run:
        working-directory: discord-bot/
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            discord-bot/
            common/
      - uses: actions/setup-go@v7
        with:
            go-version-file: ./discord-bot/go.mod
      - name: Run tests
        run: go test
  
  terraform-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.terraform-both || needs.paths-filter.outputs.terraform-image-only || needs.paths-filter.outputs.terraform-infra-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            terraform/
      - uses: hashicorp/setup-terraform@v4
      - name: Init terraform
        run: terraform init -backend=false
      - name: Validate .tf files for bootstrap
        run: |
          cd terraform/bootstrap/
          terraform validate
      - name: Validate .tf files for main
        run: |
          cd terraform/main/
          terraform validate
  