name: CI
on:
  push:
    branches: master
  pull_request:
    branches: master
  workflow_call: 

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.work
      - run: go test ./page-updater/ ./discord-bot/
